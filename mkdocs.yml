site_name: Neural MRI Scanner
site_description: Model Resonance Imaging — visualize LLM internals like a brain MRI
site_url: https://jihoonjeong.github.io/Neural-MRI/
repo_url: https://github.com/JihoonJeong/Neural-MRI
repo_name: JihoonJeong/Neural-MRI

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Installation: install.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Security: security.md
  - Code of Conduct: code-of-conduct.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: "."
      check_paths: true
